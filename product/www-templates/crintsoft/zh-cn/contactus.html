{% layout = "basect.html" %}

{-title-}联系我们{-title-}

{-content-}

<form class="form-horizontal" method="POST">
    <div class="form-group">
        <label for="inputEmail" class="col-sm-2 control-label">回复到邮件</label>
        <div class="col-sm-10">
            <input name="email" type="email" class="form-control" id="inputEmail" placeholder="Email">
        </div>
    </div>
    <div class="form-group">
        <label for="inputTitle" class="col-sm-2 control-label">标题</label>
        <div class="col-sm-10">
          <input name="title" class="form-control" id="inputTitle" placeholder="Title">
        </div>
    </div>
    <div class="form-group">
        <label for="inputMessage" class="col-sm-2 control-label">消息</label>
        <div class="col-sm-10">
            <textarea name="message" class="form-control" id="inputMessage" placeholder="Message" rows="10"></textarea>
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-default">发送</button>
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            {% if info ~= '' then %}
            <p class="bg-success" style="padding: 10px;"> {{ info }}</p>
            {% end %}

            {% if error ~= '' then %}
            <p class="bg-danger" style="padding: 10px;"> {{ error }}</p>
            {% end %}
        </div>
    </div>
</form>

{-content-}
