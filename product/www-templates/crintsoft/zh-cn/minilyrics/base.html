{% layout = "basect.html" %}

{-navigation-}

<nav id="nav_minilyrics" class="navbar navbar-default navbar-static-top" role="navigation">
	<div class="container">
        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="navbar-collapse">
            <ul class="nav navbar-nav">
                <li v-for="item in nav_items" v-bind:class="activeClass(item)">
                    <a v-bind:href="item.link">[[ item.title ]]</a>
                </li>
            </ul>
        </div>
	</div>
</nav>

<script>

var navigationApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#nav_minilyrics',
  	data: {
	  	nav_items: [
	      	{ link: '/minilyrics/', title: '什么是 MiniLyrics' },
            { link: '/minilyrics/download/', title: '下载' },
	      	// { link: '/minilyrics/buy', title: '立即购买' },
            { link: '/minilyrics/faq/', title: '帮助' },
        ],
    },
    methods: {
        activeClass: function (item) {
            if (location.pathname == item.link || 
            location.pathname.startsWith(item.link) && item.link != '/minilyrics/') {
                return 'active'
            }
            return ''
        },
    },
});

</script>
{-navigation-}
