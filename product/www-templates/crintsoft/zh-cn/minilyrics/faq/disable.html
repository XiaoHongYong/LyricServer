{-title-}MiniLyrics - 如何禁止 MiniLyrics 随我的播放器启动？{-title-}

{-sub_content-}

<div class="well">
	<h3>如何禁止 MiniLyrics 随我的播放器启动？</h3>
	<ul>
		<li>请在 MiniLyrics 窗口上单击鼠标右键</li>
		<li>点击菜单：&quot;参数设置...&quot;</li>
		<li>在弹出的窗口中，点击&quot;系统&quot; &gt; &quot;启动&quot; 页面，选择您想要 MiniLyrics 随之启动的播放器。</li>
	</ul>
	<p><img border="0" src="/static/images/setup.gif" width="584" height="491"></p>
</div>

{-sub_content-}
