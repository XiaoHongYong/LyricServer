<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="/static/css/bootstrap.min.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<script src="/static/js/jquery.min.js"></script>
	<script src="/static/js/bootstrap.bundle.min.js"></script>
	<script src="/static/js/vue.min.js"></script>
	<script src="/static/js/utils.js"></script>
	<!-- <script src="/static/js/lodash.min.js"></script> -->
	<script src="/static/js/axios.min.js"></script>

	<!-- <link href="/static/open-iconic/css/open-iconic-bootstrap.css" rel="stylesheet"> -->

	<title>{* blocks.title *}</title>
	{* blocks.script *}
</head>

<body>
	<nav id="navigation" class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav w-100">
				<template v-for="item in nav_items">
					<li v-if="item.subMenus" class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="javascript: void(0)" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
							[[ item.title ]]
						</a>
						<div class="dropdown-menu" aria-labelledby="navbarDropdown">
							<a v-for="subItem in item.subMenus" class="dropdown-item" v-bind:href="subItem.link">[[ subItem.title ]]</a>
						</div>
					</li>
					<li v-else class="nav-item">
						<a v-bind:class="getNavItemActive(item)" v-bind:href="item.link">[[ item.title ]]</a>
					</li>
				</template>

				<li v-if="isSignedIn" class="nav-item ml-auto">
					<a class="nav-link" href="/user/signout">Sign out</a>
				</li>
				<template v-else>
					<li class="nav-item ml-auto">
						<a class="nav-link" href="/user/signin">Sign in</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/user/signup">Sign up</a>
					</li>
				</template>
			</ul>
		</div>
	</nav>

	{* blocks.navigation *}

	<br>

<div class="content_container" id="content">
	{* blocks.content *}
</div>

<div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 200px;">
	<div id="toast" v-bind:role="isAlert ? 'alert' : 'status'" class="toast" style="position: fixed; bottom: 0; right: 0;  width: 400px;">
		<div class="toast-header">
			<!-- <span v-bind:class="'mr-2 oi oi-icon-' + isAlert ? 'warning' : 'info'" aria-hidden="true"></span> -->
			<strong class="mr-auto">[[ title ]]</strong>
			<button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div v-bind:class="isAlert ? 'alert-danger toast-body' : 'alert-info toast-body'">
			[[ message ]]
		</div>
	</div>
</div>

<div class="container">
	<div id="footer">
		{* blocks.footer *}
	</div>
</div>

<script type="text/javascript">

var isSignedIn = {{ isSignedIn }};

var navigationApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#navigation',
  	data: {
	  	nav_items: [
	      	{ link: '/', title: 'ViewLyrics.com' },
			{
				link: '/user/', title: 'Account',
				subMenus: [
					{ link: '/user/profile', title: 'Profile' },
					{ link: '/user/uploaded-lyrics', title: 'My Uploaded Lyrics' },
					{ link: '/user/change-password', title: 'Change Password' },
				],
			},
            { link: '/top-lyrics/', title: 'Top Lyrics' },
	      	{ link: '/top-artist/', title: 'Top Artist' },
            { link: 'http://www.crintsoft.com/', title: 'MiniLyrics' },
		],
		isSignedIn: isSignedIn,
	},
	methods: {
	  	getNavItemActive: function (item) {
			var pathname = item.link.split('#')[0].split('?')[0];
	  		if (pathname === location.pathname || (pathname.length > 1 && location.pathname.startsWith(pathname))) {
				return 'nav-link active';
			} else {
				return 'nav-link';
			}
		},
		gotoLink: function (link) {
			location = link;
		},
		signout: function () {
			if (this.isSignedIn) {
				location = '/user/signout';
			} else {
				location = '/user/signin';
			}
		}
  	}
});

var toastApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#toast',
  	data: {
		title: '',
		message: '',
		isAlert: false,
	},
	methods: {
	  	alert: function (title, message) {
			if (arguments.length > 1) {
				var args = Array.prototype.slice.call(arguments, 1);
				this.message = stringFormat.apply(window, args);
				this.title = title || '错误';
			} else {
				this.message = title;
				this.title = '错误';
			}
			this.isAlert = true;

			console.warn(title, message);
			$('#toast').toast('show');
	  	},
	  	info: function (title, message) {
			if (arguments.length > 1) {
				var args = Array.prototype.slice.call(arguments, 1);
				this.message = stringFormat.apply(window, args);
				this.title = title || '错误';
			} else {
				this.message = title;
				this.title = '信息';
			}
			this.isAlert = false;

			console.info(title, message);
			$('#toast').toast('show');
	  	}
  	}
});

$('#toast').toast({autohide: true, delay: 5000});

</script>


</body>
</html>
