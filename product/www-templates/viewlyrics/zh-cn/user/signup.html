{% layout = "base.html" %}

{-title-}注册{-title-}

{-content-}
<div class="row">
    <div class="col-sm-3">
    </div>
    <div class="col-sm-6" id="signup">
        <form method="POST" v-on:submit="return signupCheck($event)">
            <div class="form-group">
                <h3>在 ViewLyrics.com 注册账号</h3>
                <br>
            </div>
            <input hidden name="redirect" type="text" value="{{ redirect }}">
            <div class="form-group row">
                <label for="inputUserName" class="col-sm-4 col-form-label">用户名</label>
                <div class="col-sm-8">
                    <input name="username" type="text" class="form-control" id="inputUserName" placeholder="用户名"
                        v-model="username">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputEmail" class="col-sm-4 col-form-label">邮件</label>
                <div class="col-sm-8">
                    <input name="email" type="email" class="form-control" id="inputEmail" placeholder="邮件地址"
                    v-model="email">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPassword" class="col-sm-4 col-form-label">密码</label>
                <div class="col-sm-8">
                    <input name="password" type="password" class="form-control" id="inputPassword" placeholder="密码"
                    v-model="password">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPasswordConfirm" class="col-sm-4 col-form-label">确认密码</label>
                <div class="col-sm-8">
                    <input v-model="password_confirm" type="password" class="form-control" id="inputPasswordConfirm" placeholder="确认密码"
                    v-model="password_confirm">
                </div>
            </div>
            <div v-if="error" class="form-group alert alert-danger" role="alert">
                [[ error ]]
            </div>
            <div class="form-group row">
                <div class="col-sm-4">
                    <button type="submit" class="btn btn-primary">注册</button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-3">
    </div>
</div>

<script>

var profileApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#signup',
  	data: {
        username: decodeHtml('{{ username }}'),
        email: decodeHtml('{{ email }}'),
        password: decodeHtml('{{ password }}'),
        password_confirm: decodeHtml('{{ password }}'),
        error: decodeHtml('{{ error }}'),
    },
	methods: {
        signupCheck: function (event) {
            if (!this.email) {
                this.error = '请输入邮件地址';
                event.preventDefault();
                return;
            }

            if (!validateEmail(this.email)) {
                this.error = '请输入有效邮件地址。';
                event.preventDefault();
                return;
            }

            this.error = ValidatePasswordChars(this.password);
            if (this.error) {
                event.preventDefault();
                return;
            }

            if (this.password.length < 6) {
                this.error = '密码至少 6 个字符长';
                event.preventDefault();
                return;
            }

            if (!this.password || !this.password_confirm) {
                this.error = '清输入密码和确认密码';
                event.preventDefault();
                return;
            }

            if (this.password != this.password_confirm) {
                this.error = "输入的密码不一致";
                event.preventDefault();
                return;
            }
		},
  	}
});

</script>

{-content-}
