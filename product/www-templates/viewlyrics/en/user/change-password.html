{% layout = "base.html" %}

{-title-}Change Password{-title-}

{-content-}
<div class="row" id="change_password">
    <div class="col-sm-3">
    </div>
    <div class="col-sm-6">
        <form method="POST" v-on:submit.prevent>
            <div class="form-group">
                <h3>Change Password</h3>
                <br>
            </div>
            <div class="form-group row">
                <label for="inputOldPassword" class="col-sm-4 col-form-label">Old password</label>
                <div class="col-sm-8">
                    <input v-model="password_old" type="password" class="form-control" id="inputOldPassword" placeholder="Old password">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPassword" class="col-sm-4 col-form-label">Password</label>
                <div class="col-sm-8">
                    <input v-model="password" type="password" class="form-control" id="inputPassword" placeholder="New password">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPasswordConfirm" class="col-sm-4 col-form-label">Confirm new password</label>
                <div class="col-sm-8">
                    <input v-model="password_confirm" type="password" class="form-control" id="inputPasswordConfirm" placeholder="Confirm password">
                </div>
            </div>
            <div v-if="error" class="form-group alert alert-danger" role="alert">
                [[ error ]]
            </div>
            <div v-if="info" class="form-group alert alert-info" role="alert">
                [[ info ]]
            </div>
            <div class="form-group row">
                <div class="col-sm-4">
                    <button v-on:click="updatePassword()" class="btn btn-primary">Update password</button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-3">
    </div>
</div>

<script type="text/javascript">

var profileApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#change_password',
  	data: {
        password_old: '',
        password: '',
        password_confirm: '',
        error: '',
        info: '',
    },
	methods: {
        updatePassword(event) {
            this.error = ValidatePasswordChars(this.password);
            if (this.error) {
                return;
            }

            if (!this.password_old) {
                this.error = 'Please input old password.';
                return;
            }

            if (!this.password || !this.password_confirm) {
                this.error = 'Please input password and confirm new password.';
                return;
            }

            if (this.password != this.password_confirm) {
                this.error = "The password inputed doesn't match.";
                return;
            }

            this.error = '';
            this.info = '';

            var thiz = this;
            axios.post('/user/change-password', {
                password_old: this.password_old,
                password: this.password,
            })
            .then(function (response) {
                thiz.error = response.data.error;
                if (!thiz.error) {
                    thiz.info = 'Password was updated successfully.';
                }
            })
            .catch(function (error) {
                console.log(error);
            });
		},
  	}
});

</script>

{-content-}
