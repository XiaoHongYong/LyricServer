{% layout = "base.html" %}

{-title-}Sign in{-title-}

{-content-}
<div class="row">
    <div class="col-sm-3">
    </div>
    <div class="col-sm-6">
        <form method="POST">
            <div class="form-group">
                <h3>Sign in to ViewLyrics.com</h3>
                <br>
            </div>
            <input hidden name="redirect" type="text" value="{{ redirect }}">
            <div class="form-group row">
                <label for="inputEmail" class="col-sm-4 col-form-label">User name or email</label>
                <div class="col-sm-8">
                    <input name="user" type="text" class="form-control" id="inputEmail" placeholder="User name or email address">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPassword" class="col-sm-4 col-form-label">Password</label>
                <div class="col-sm-8">
                    <input name="password" type="password" class="form-control" id="inputPassword" placeholder="Password">
                </div>
            </div>
            <!-- <div class="form-group row">
                <div class="col-sm-4"></div>
                <div class="col-sm-8">
                <div class="form-check">
                    <input name="keep_sign_in" class="form-check-input" type="checkbox" id="gridCheck1">
                    <label class="form-check-label" for="gridCheck1">
                        Keep me logged in
                    </label>
                </div>
                </div>
            </div> -->
            {% if error ~= '' then %}
                <div class="form-group alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% end %}
            <div class="form-group row">
                <div class="col-sm-4">
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </div>
                <div class="col-sm-8">
                    <a href="signup">Create an account</a><br>
                    <a href="password_reset">Forgot password?</a>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-3">
    </div>
</div>
{-content-}

{-footer-}

{-footer-}
