{% layout = "base.html" %}

{-title-}Sign up{-title-}

{-content-}
<div class="row">
    <div class="col-sm-3">
    </div>
    <div class="col-sm-6" id="signup">
        <form method="POST" v-on:submit="return signupCheck($event)">
            <div class="form-group">
                <h3>Sign up to ViewLyrics.com</h3>
                <br>
            </div>
            <input hidden name="redirect" type="text" value="{{ redirect }}">
            <div class="form-group row">
                <label for="inputUserName" class="col-sm-4 col-form-label">Username</label>
                <div class="col-sm-8">
                    <input name="username" type="text" class="form-control" id="inputUserName" placeholder="Username"
                        v-model="username">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputEmail" class="col-sm-4 col-form-label">Email</label>
                <div class="col-sm-8">
                    <input name="email" type="email" class="form-control" id="inputEmail" placeholder="Email address"
                    v-model="email">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPassword" class="col-sm-4 col-form-label">Password</label>
                <div class="col-sm-8">
                    <input name="password" type="password" class="form-control" id="inputPassword" placeholder="Password"
                    v-model="password">
                </div>
            </div>
            <div class="form-group row">
                <label for="inputPasswordConfirm" class="col-sm-4 col-form-label">Confirm password</label>
                <div class="col-sm-8">
                    <input v-model="password_confirm" type="password" class="form-control" id="inputPasswordConfirm" placeholder="Confirm password"
                    v-model="password_confirm">
                </div>
            </div>
            <div v-if="error" class="form-group alert alert-danger" role="alert">
                [[ error ]]
            </div>
            <div class="form-group row">
                <div class="col-sm-4">
                    <button type="submit" class="btn btn-primary">Sign up</button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-3">
    </div>
</div>

<script>

var profileApp = new Vue({
	delimiters: ['[[', ']]'],
  	el: '#signup',
  	data: {
        username: '{* username *}',
        email: '{* email *}',
        password: '{* password *}',
        password_confirm: '{* password *}',
        error: '{* error *}',
    },
	methods: {
        signupCheck: function (event) {
            if (!this.email) {
                this.error = 'Please input email address.';
                event.preventDefault();
                return;
            }

            if (!validateEmail(this.email)) {
                this.error = 'Please input valid email address.';
                event.preventDefault();
                return;
            }

            this.error = ValidatePasswordChars(this.password);
            if (this.error) {
                event.preventDefault();
                return;
            }

            if (this.password.length < 6) {
                this.error = 'The password must be at least 6 characters long.';
                event.preventDefault();
                return;
            }

            if (!this.password || !this.password_confirm) {
                this.error = 'Please input password and confirm password.';
                event.preventDefault();
                return;
            }

            if (this.password != this.password_confirm) {
                this.error = "The password inputed doesn't match.";
                event.preventDefault();
                return;
            }
		},
  	}
});

</script>
