
resolver 8.8.8.8;

log_format  main  '$remote_addr "$time_local" "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

# access_log  /mlserver/logs/access.log  main;
error_log /mlserver/logs/error.log crit;
# error_log /mlserver/logs/error.log info;

lua_package_path '/mlserver/lua/?.lua;;';

# Turn it on in production environment
lua_code_cache on;
#lua_code_cache off;

upstream backend_lyrcis_service {
    server localhost:8101;
}

server {
    listen 80;
    server_name search.crintsoft.com;

    access_log  /mlserver/logs/access_search.log  main buffer=32k;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        # root   "/mlserver/html";
        # echo "Internal server error."
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location = / {
        proxy_pass http://backend_lyrcis_service/r/;
    }

    location /searchlyrics.htm {
        proxy_pass http://backend_lyrcis_service/searchlyrics.htm;
    }

    location /s {
        proxy_pass http://backend_lyrcis_service/status/;
    }

    location /api-i/data-sync {
        proxy_pass http://backend_lyrcis_service/api-i/data-sync;
    }

    location /l/ {
        alias "/mlserver/lyrics/";
        index  index.html index.htm;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name viewlyrics.com www.viewlyrics.com;

    ssl_certificate /etc/letsencrypt/live/viewlyrics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewlyrics.com/privkey.pem;

    include "/etc/letsencrypt/options-ssl-nginx.conf";

    # Redirect non-https traffic to https
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    access_log  /mlserver/logs/access_viewlyrics.log  main buffer=32k;
    # error_log /mlserver/logs/error_viewlyrics.log crit;
    # error_log /mlserver/logs/error_viewlyrics.log info;

    set $template_root "/mlserver/www-templates/viewlyrics/";

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location / {
        default_type 'text/html;charset=utf-8';
        access_by_lua_block {
            local entry = require "ViewlyricsMain"
            entry.handleAll()
        }
    }

    location favicon.ico {
        alias /mlserver/www-static/viewlyrics/favicon.ico;
    }

    location /static/ {
        alias /mlserver/www-static/viewlyrics/static/;
    }

    # Support https://certbot.eff.org/lets-encrypt/ubuntubionic-other
    location /.well-known {
        alias /mlserver/www-static/.well-known;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name crintsoft.com www.crintsoft.com minilyrics.com www.minilyrics.com;

    ssl_certificate /etc/letsencrypt/live/viewlyrics.com/fullchain.pem;
