            local entry = require "crintsoftMain"
            entry.handleAll()
        }
    }

    location favicon.ico {
        alias /mlserver/www-static/crintsoft/favicon.ico;
    }

    location /static/ {
        alias /mlserver/www-static/crintsoft/static/;
    }

    location /download/ {
        alias /mlserver/www-static/crintsoft/download/;
    }

    # Support https://certbot.eff.org/lets-encrypt/ubuntubionic-other
    location /.well-known {
        alias /mlserver/www-static/.well-known;
    }
}
