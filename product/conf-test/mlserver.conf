
server_names_hash_bucket_size  64;

resolver 8.8.8.8;

log_format  main  '$remote_addr "$time_local" "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

error_log logs/error.log info;

lua_package_path 'lua/?.lua;;';

# Turn it on in production environment
# lua_code_cache on;
lua_code_cache off;

upstream backend_lyrcis_service {
    server localhost:8000;
}

server {
    listen 80;
    server_name search.crintsoft.com s.c.com;

    access_log  logs/access_search.log  main;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        # echo "Internal server error."
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location = / {
        default_type 'text/html;charset=utf-8';

        content_by_lua_block {
            local response = "Service's online."
            ngx.say(response)
        }
    }

    location /searchlyrics.htm {
        proxy_pass http://backend_lyrcis_service/searchlyrics.htm;
    }

    location /s {
        proxy_pass http://backend_lyrcis_service/status/;
    }

    location /api-i/data-sync {
        proxy_pass http://backend_lyrcis_service/api-i/data-sync;
    }

    location /l/ {
        alias "lyrics/";
        index  index.html index.htm;
    }

    location /analytics {
        access_by_lua_block {
            local response = "Result=OK"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }
}

server {
    listen 80;
    server_name viewlyrics.com www.viewlyrics.com v.com en.v.com zh-cn.v.com;

    access_log  logs/viewlyrics_access.log  main;

    # lua_need_request_body on;

    set $template_root "www-templates/viewlyrics/";

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found."
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location /static/ {
        alias www-static/viewlyrics/static/;
    }

    location /lua_ut {
        default_type 'text/html;charset=utf-8';
        access_by_lua_block {
            local entry = require "tests.test_all"
            entry.on_access({})
        }
    }

    location / {
        default_type 'text/html;charset=utf-8';
        access_by_lua_block {
            local entry = require "ViewlyricsMain"
            entry.handleAll()
        }
    }

    location /lyrics/ {
        alias "/mlserver/lyrics/";
        index  index.html index.htm;
    }
}

server {
    listen 80;
    server_name crintsoft.com www.crintsoft.com minilyrics.com www.minilyrics.com c.com en.c.com zh-cn.c.com;

    access_log logs/crintsoft_access.log  main;

    set $template_root "www-templates/crintsoft/";

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location / {
        default_type 'text/html;charset=utf-8';
        access_by_lua_block {
            local entry = require "crintsoftMain"
            entry.handleAll()
        }
    }

    location /static/ {
        alias www-static/crintsoft/static/;
    }

    location /download/ {
        alias crintsoft.com/download/;
    }
}
